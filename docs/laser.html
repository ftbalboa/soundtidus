const canvas = document.getElementById('waveform');
const ctx = canvas.getContext('2d');

let audio = new Audio(audioData);
let playing = false;
let animFrame = null;

// Decode and draw waveform
fetch(audioData)
  .then(r => r.arrayBuffer())
  .then(buf => {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx.decodeAudioData(buf);
  })
  .then(decoded => {
    const data = decoded.getChannelData(0);
    drawWaveform(data);
  });

function drawWaveform(data) {
  const w = canvas.width;
  const h = canvas.height;
  const mid = h / 2;

  ctx.fillStyle = '#12121e';
  ctx.fillRect(0, 0, w, h);

  // Grid lines
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, mid); ctx.lineTo(w, mid);
  ctx.stroke();

  // Waveform
  ctx.strokeStyle = '#4a6';
  ctx.lineWidth = 1.5;
  ctx.beginPath();

  const step = Math.max(1, Math.floor(data.length / w));
  for (let x = 0; x < w; x++) {
    const idx = Math.floor(x * data.length / w);
    // Find min/max in this window for anti-aliasing
    let min = 1, max = -1;
    for (let j = 0; j < step; j++) {
      const val = data[idx + j] || 0;
      if (val < min) min = val;
      if (val > max) max = val;
    }
    const y1 = mid - max * mid * 0.9;
    const y2 = mid - min * mid * 0.9;
    ctx.moveTo(x, y1);
    ctx.lineTo(x, y2);
  }
  ctx.stroke();

  // Store for playhead drawing
  canvas._waveData = data;
}

function drawPlayhead() {
  if (!canvas._waveData || !playing) return;
  const data = canvas._waveData;
  const progress = audio.currentTime / audio.duration;
  if (isNaN(progress)) return;

  drawWaveform(data);

  // Playhead line
  const x = Math.floor(progress * canvas.width);
  ctx.strokeStyle = '#e74c3c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, 0);
  ctx.lineTo(x, canvas.height);
  ctx.stroke();

  if (playing) animFrame = requestAnimationFrame(drawPlayhead);
}

function togglePlay() {
  if (playing) {
    audio.pause();
    playing = false;
    document.getElementById('playBtn').textContent = 'Play';
    document.getElementById('playBtn').classList.remove('active');
    if (animFrame) cancelAnimationFrame(animFrame);
  } else {
    if (audio.ended || audio.currentTime >= audio.duration) {
      audio.currentTime = 0;
    }
    audio.play();
    playing = true;
    document.getElementById('playBtn').textContent = 'Pause';
    document.getElementById('playBtn').classList.add('active');
    drawPlayhead();
  }
}

audio.addEventListener('ended', () => {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  document.getElementById('playBtn').classList.remove('active');
  if (canvas._waveData) drawWaveform(canvas._waveData);
});

function setSpeed(val) {
  audio.playbackRate = parseFloat(val);
  document.getElementById('speedLabel').textContent = val + 'x';
}
</script>
